<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DOM Explorer - Ejercicio 5</title>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/styles/styles.css">
</head>
<body data-theme="dark">

  <nav class="navbar navbar-expand-lg navbar-dark fixed-top">
    <div class="container">
      <a class="navbar-brand" href="#">DOM Explorer <span class="badge bg-violet ms-2">#5</span></a>
      <button id="themeToggle" class="btn btn-outline-light btn-sm ms-auto">🌙 Modo Oscuro</button>
    </div>
  </nav>

  <main class="container my-5">
    <!-- Panel de Controles -->
    <section class="controls-card">
      <div class="row align-items-center g-3">
        <div class="col-md-8">
          <h5 class="text-cyan mb-3">Insertar Elementos</h5>
          <div class="d-flex flex-wrap gap-2">
            <button class="btn btn-custom btn-sm" data-type="table">Agregar Tabla</button>
            <button class="btn btn-custom btn-sm" data-type="card">Agregar Card</button>
            <button class="btn btn-custom btn-sm" data-type="form">Agregar Formulario</button>
            <button class="btn btn-custom btn-sm" data-type="list">Agregar Lista</button>
            <button class="btn btn-custom btn-sm" data-type="alert">Agregar Alert</button>
          </div>
        </div>
        <div class="col-md-4 text-md-end border-start border-secondary">
          <h5 class="text-violet mb-3">Gestión</h5>
          <div class="d-flex flex-wrap gap-2 justify-content-md-end">
            <button id="btn-undo" class="btn btn-outline-warning btn-sm">Deshacer último</button>
            <button id="btn-clear" class="btn btn-outline-danger btn-sm">Limpiar todo</button>
          </div>
          <div class="mt-2 small code-font text-muted">
            Total elementos: <span id="total-count" class="text-cyan fw-bold">0</span>
          </div>
        </div>
      </div>
    </section>

    <!-- Área de Contenido -->
    <section id="content-area" class="pb-5">
      <!-- Los elementos se insertarán aquí -->
    </section>
  </main>

  <footer>
    <div class="container text-center">
      <p class="mb-0 text-muted">DOM Explorer Suite - Ejercicio 5 - Inserción Dinámica</p>
      <small class="text-secondary">© 2026 Senior Full Stack Developer</small>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js?v=2"></script>
  <script type="module" src="/contexto/themeContext.js?v=2"></script>
  <script type="module" src="/scripts/templates.js?v=2"></script>
  <script type="module" src="/scripts/main.js?v=2"></script>
</body>
</html>
