<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DOM Explorer - Ejercicio 4</title>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/styles/styles.css">
</head>
<body data-theme="dark">

  <nav class="navbar navbar-expand-lg navbar-dark fixed-top">
    <div class="container">
      <a class="navbar-brand" href="#">DOM Explorer <span class="badge bg-violet ms-2">#4</span></a>
      <button id="themeToggle" class="btn btn-outline-light btn-sm ms-auto">🌙 Modo Oscuro</button>
    </div>
  </nav>

  <main class="container my-5">
    <div class="row g-4">
      <!-- Columna 1: Creación -->
      <aside class="col-lg-3">
        <div class="card p-3 h-100">
          <h5 class="card-title text-violet mb-4">Crear Nodos</h5>
          <div class="d-grid gap-2" id="create-buttons">
            <!-- Botones dinámicos aquí -->
          </div>
          <hr class="border-secondary my-4">
          <div class="d-grid gap-2">
            <button id="btn-create-all" class="btn btn-outline-cyan btn-sm">Crear todos</button>
            <button id="btn-restore-all" class="btn btn-outline-secondary btn-sm">Restaurar originales</button>
          </div>
        </div>
      </aside>

      <!-- Columna 2: Visualización -->
      <section class="col-lg-5">
        <div class="card p-4 h-100 bg-dark" style="border: 2px dashed rgba(6, 182, 212, 0.1);">
          <h5 class="card-title text-cyan mb-4">Área de Visualización</h5>
          <div id="links-container">
            <!-- Cards de enlaces aquí -->
            <p class="text-muted text-center py-5" id="empty-msg">No hay enlaces creados aún</p>
          </div>
        </div>
      </section>

      <!-- Columna 3: Log -->
      <aside class="col-lg-4">
        <div class="card p-3 h-100">
          <div class="d-flex justify-content-between align-items-center mb-4">
            <h5 class="card-title text-orange mb-0">Historial de Cambios</h5>
            <button id="btn-clear-log" class="btn btn-sm btn-outline-danger">Limpiar</button>
          </div>
          <div id="log-container" class="log-container code-font">
            <!-- Entradas de log aquí -->
          </div>
        </div>
      </aside>
    </div>
  </main>

  <footer>
    <div class="container text-center">
      <p class="mb-0 text-muted">DOM Explorer Suite - Ejercicio 4 - Links & Atributos</p>
      <small class="text-secondary">© 2026 Senior Full Stack Developer</small>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js?v=2"></script>
  <script type="module" src="/contexto/themeContext.js?v=2"></script>
  <script type="module" src="/scripts/log.js?v=2"></script>
  <script type="module" src="/scripts/links.js?v=2"></script>
</body>
</html>
