<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 5 - Resultados</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Estilos personalizados -->
    <link rel="stylesheet" href="/styles/ejercicio5.css">
</head>
<body class="d-flex flex-column min-vh-100">
    <!-- Header -->
    <header class="p-3 mb-4 border-bottom shadow-sm d-flex justify-content-between align-items-center header-nav">
        <h1 class="h3 mb-0 fw-bold">Resultados de Ejercicios</h1>
        <button id="btnToggleTema" class="btn btn-outline-secondary rounded-pill px-4 shadow-sm">
            Cambiar Tema
        </button>
    </header>

    <!-- Main Content -->
    <main class="flex-grow-1 container pb-5">
        <div class="row justify-content-center">
            <div class="col-12 col-lg-10">
                <div class="card shadow border-0 rounded-4 card-main">
                    <div class="card-body p-4" id="contenido">
                        <!-- Spinner de carga -->
                        <div class="text-center py-5">
                            <div class="spinner-border text-primary" role="status">
                                <span class="visually-hidden">Cargando...</span>
                            </div>
                            <p class="mt-3 text-muted">Obteniendo datos del servidor...</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="mt-auto py-3 text-center border-top shadow-sm footer-nav">
        <div class="container">
            <span class="fw-medium">Alumno: Taiel | Año: 2026</span>
        </div>
    </footer>

    <!-- Script como módulo -->
    <script type="module" src="/scripts/ejercicio5.js"></script>
</body>
</html>
