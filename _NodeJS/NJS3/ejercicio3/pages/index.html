<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DOM Explorer - Ejercicio 3</title>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/styles/styles.css">
</head>
<body data-theme="dark">

  <nav class="navbar navbar-expand-lg navbar-dark fixed-top">
    <div class="container">
      <a class="navbar-brand" href="#">DOM Explorer <span class="badge bg-violet ms-2">#3</span></a>
      <button id="themeToggle" class="btn btn-outline-light btn-sm ms-auto">🌙 Modo Oscuro</button>
    </div>
  </nav>

  <main class="container my-5">
    <!-- Breadcrumb -->
    <nav aria-label="breadcrumb" class="mb-4">
      <ol class="breadcrumb code-font">
        <li class="breadcrumb-item text-muted">SPA</li>
        <li id="breadcrumb-active" class="breadcrumb-item active text-cyan" aria-current="page">Contador</li>
      </ol>
    </nav>

    <div class="row g-4">
      <!-- Menú Lateral -->
      <aside class="col-md-3">
        <div class="card p-3">
          <div class="nav flex-column nav-pills" id="v-pills-tab" role="tablist">
            <button class="nav-link active" data-component="counter">1. Contador</button>
            <button class="nav-link" data-component="transformer">2. Transformador</button>
            <button class="nav-link" data-component="list">3. Lista Dinámica</button>
            <button class="nav-link" data-component="clock">4. Reloj</button>
            <button class="nav-link" data-component="palette">5. Paleta</button>
          </div>
        </div>
      </aside>

      <!-- Área de Contenido -->
      <section class="col-md-9">
        <div id="component-container">
          <!-- El componente se carga aquí -->
        </div>
      </section>
    </div>
  </main>

  <footer>
    <div class="container text-center">
      <p class="mb-0 text-muted">DOM Explorer Suite - Ejercicio 3 - Inspección de Nodos</p>
      <small class="text-secondary">© 2026 Senior Full Stack Developer</small>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="/contexto/themeContext.js?v=2"></script>
  <script type="module" src="/scripts/navegacion.js?v=2"></script>
</body>
</html>
