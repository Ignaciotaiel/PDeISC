<!-- FIXES: Replaced form with exact requested fields (including dynamic children field), added table for localStorage display, added theme integration. -->
<!DOCTYPE html>
<html lang="es" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proyecto 3 - Registro de Personas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/styles/style.css">
</head>
<body class="min-vh-100 bg-body-tertiary">
    <div class="container py-5">
        <div class="d-flex justify-content-end mb-4" id="theme-btn-container"></div>
        
        <div class="text-center mb-5">
            <i class="bi bi-people-fill text-info display-1"></i>
            <h1 class="mt-3 text-info">Registro Civil</h1>
            <p class="text-muted">Proyecto 3: Almacenamiento Local de Personas</p>
        </div>
        
        <div class="row g-4">
            <!-- Formulario -->
            <div class="col-lg-5">
                <div class="card shadow-lg border-0 rounded-4 h-100">
                    <div class="card-header bg-info text-white py-3">
                        <h5 class="mb-0"><i class="bi bi-person-plus me-2"></i>Nueva Persona</h5>
                    </div>
                    <div class="card-body p-4">
                        <div id="alert-container"></div>
                        <form id="personForm" novalidate>
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label for="nombre" class="form-label">Nombre</label>
                                    <input type="text" class="form-control" id="nombre" required>
                                    <div class="invalid-feedback"></div>
                                </div>
                                <div class="col-md-6">
                                    <label for="apellido" class="form-label">Apellido</label>
                                    <input type="text" class="form-control" id="apellido" required>
                                    <div class="invalid-feedback"></div>
                                </div>
                                <div class="col-md-6">
                                    <label for="fechaNacimiento" class="form-label">Fecha de Nac.</label>
                                    <input type="date" class="form-control" id="fechaNacimiento" required>
                                    <div class="invalid-feedback"></div>
                                </div>
                                <div class="col-md-6">
                                    <label for="edad" class="form-label">Edad</label>
                                    <input type="number" class="form-control" id="edad" min="0" required>
                                    <div class="invalid-feedback"></div>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Sexo</label>
                                    <div>
                                        <div class="form-check form-check-inline">
                                            <input class="form-check-input" type="radio" name="sexo" id="sexoM" value="Masculino" required>
                                            <label class="form-check-label" for="sexoM">Masculino</label>
                                        </div>
                                        <div class="form-check form-check-inline">
                                            <input class="form-check-input" type="radio" name="sexo" id="sexoF" value="Femenino" required>
                                            <label class="form-check-label" for="sexoF">Femenino</label>
                                        </div>
                                    </div>
                                    <div class="invalid-feedback d-block" id="sexo-feedback"></div>
                                </div>
                                <div class="col-md-6">
                                    <label for="dni" class="form-label">DNI</label>
                                    <input type="text" class="form-control" id="dni" required>
                                    <div class="invalid-feedback"></div>
                                </div>
                                <div class="col-md-6">
                                    <label for="estadoCivil" class="form-label">Estado Civil</label>
                                    <select class="form-select" id="estadoCivil" required>
                                        <option value="">Seleccione...</option>
                                        <option value="Soltero/a">Soltero/a</option>
                                        <option value="Casado/a">Casado/a</option>
                                        <option value="Divorciado/a">Divorciado/a</option>
                                        <option value="Viudo/a">Viudo/a</option>
                                    </select>
                                    <div class="invalid-feedback"></div>
                                </div>
                                <div class="col-md-6">
                                    <label for="nacionalidad" class="form-label">Nacionalidad</label>
                                    <input type="text" class="form-control" id="nacionalidad" required>
                                    <div class="invalid-feedback"></div>
                                </div>
                                <div class="col-md-6">
                                    <label for="telefono" class="form-label">Teléfono</label>
                                    <input type="text" class="form-control" id="telefono" required>
                                    <div class="invalid-feedback"></div>
                                </div>
                                <div class="col-md-6">
                                    <label for="email" class="form-label">Email</label>
                                    <input type="email" class="form-control" id="email" required>
                                    <div class="invalid-feedback"></div>
                                </div>
                                
                                <!-- Hijos Dinámico -->
                                <div class="col-12 border rounded p-3 mt-3 bg-light-subtle">
                                    <div class="form-check form-switch mb-2">
                                        <input class="form-check-input" type="checkbox" role="switch" id="tieneHijos">
                                        <label class="form-check-label" for="tieneHijos">¿Tiene hijos?</label>
                                    </div>
                                    <div id="cantidadHijosContainer" class="d-none">
                                        <label for="cantidadHijos" class="form-label">Cantidad de hijos</label>
                                        <input type="number" class="form-control" id="cantidadHijos" min="1" value="1">
                                        <div class="invalid-feedback"></div>
                                    </div>
                                </div>
                                
                                <div class="col-12 mt-4">
                                    <button type="submit" class="btn btn-info text-white btn-lg w-100" id="submitBtn" disabled>
                                        <i class="bi bi-save me-2"></i>Guardar en LocalStorage
                                    </button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Lista de Personas -->
            <div class="col-lg-7">
                <div class="card shadow-sm border-0 rounded-4">
                    <div class="card-header bg-dark text-white py-3 d-flex justify-content-between align-items-center">
                        <h5 class="mb-0"><i class="bi bi-card-list me-2"></i>Personas Registradas</h5>
                        <span class="badge bg-info text-dark fs-6 rounded-pill" id="people-count">0</span>
                    </div>
                    <div class="card-body p-0">
                        <ul class="list-group list-group-flush" id="people-list">
                            <!-- Dynamic Content -->
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Modal de Confirmación de Borrado -->
    <div class="modal fade" id="deleteConfirmModal" tabindex="-1" aria-labelledby="deleteConfirmModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header bg-danger text-white">
                    <h5 class="modal-title" id="deleteConfirmModalLabel">
                        <i class="bi bi-exclamation-triangle-fill me-2"></i>Confirmar Eliminación
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    ¿Estás seguro de que deseas eliminar este registro? Esta acción no se puede deshacer.
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-danger" id="confirmDeleteBtn">Sí, eliminar</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="/scripts/main.js"></script>
</body>
</html>
